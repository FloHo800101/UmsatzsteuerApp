name: "Pages Deploy Frontend"

on:
  push:
    branches:
      - main
    paths:
      - "UmsatzsteuerApp_Monorepo_Starter/frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-frontend"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "UmsatzsteuerApp_Monorepo_Starter/frontend/package-lock.json"

      - name: Install
        working-directory: UmsatzsteuerApp_Monorepo_Starter/frontend
        run: npm ci || npm i

      - name: Build
        working-directory: UmsatzsteuerApp_Monorepo_Starter/frontend
        run: npm run build

      - name: Prepare Pages artifact (SPA fallback + nojekyll)
        run: |
          cp UmsatzsteuerApp_Monorepo_Starter/frontend/dist/index.html UmsatzsteuerApp_Monorepo_Starter/frontend/dist/404.html || true
          touch UmsatzsteuerApp_Monorepo_Starter/frontend/dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "UmsatzsteuerApp_Monorepo_Starter/frontend/dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
