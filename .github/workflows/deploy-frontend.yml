name: Pages: Deploy (frontend)

on:
  push:
    branches: [ main ]
    paths:
      - 'UmsatzsteuerApp_Monorepo_Starter/frontend/**'
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Monorepo: korrektes Frontend-Verzeichnis ermitteln
      - name: Pick frontend directory
        id: pick
        run: |
          if [ -f "UmsatzsteuerApp_Monorepo_Starter/frontend/package.json" ]; then
            echo "dir=UmsatzsteuerApp_Monorepo_Starter/frontend" >> $GITHUB_OUTPUT
            echo "Using dir: UmsatzsteuerApp_Monorepo_Starter/frontend"
          elif [ -f "frontend/package.json" ]; then
            echo "dir=frontend" >> $GITHUB_OUTPUT
            echo "Using dir: frontend"
          else
            echo "ERROR: No frontend directory found." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # beide Lockfiles cachen (egal welcher Pfad zutrifft)
          cache-dependency-path: |
            UmsatzsteuerApp_Monorepo_Starter/frontend/package-lock.json
            frontend/package-lock.json

      - name: Install
        working-directory: ${{ steps.pick.outputs.dir }}
        run: npm ci || npm i

      - name: Build
        working-directory: ${{ steps.pick.outputs.dir }}
        run: npm run build

      # SPA-Fallback: Deep-Links funktionieren auf GitHub Pages
      - name: SPA 404 fallback
        run: |
          cp "${{ steps.pick.outputs.dir }}/dist/index.html" "${{ steps.pick.outputs.dir }}/dist/404.html" || true
          touch "${{ steps.pick.outputs.dir }}/dist/.nojekyll"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.pick.outputs.dir }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
