name: "Pages Deploy Belegprüfungs Frontend"

on:
  push:
    branches:
      - main
    paths:
      - "UmsatzsteuerApp_Monorepo_Starter/frontend-belegpruefung/**"
      - ".github/workflows/deploy-belegpruefung.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-belegpruefung"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Diagnostics - system
        run: |
          echo "Node: $(node -v || true)"
          echo "NPM: $(npm -v || true)"
          echo "pwd: $(pwd)"
          echo "ls root:" && ls -la || true
          echo "ls frontend:" && ls -la UmsatzsteuerApp_Monorepo_Starter/frontend-belegpruefung || true
      - name: Install
        working-directory: UmsatzsteuerApp_Monorepo_Starter/frontend-belegpruefung
        run: npm ci || npm i

      - name: Build (force base & capture logs)
        working-directory: UmsatzsteuerApp_Monorepo_Starter/frontend-belegpruefung
        env:
          VITE_BASE: '/UmsatzsteuerApp/'
        run: |
          echo "PWD: $(pwd)";
          echo "Run build with base: /UmsatzsteuerApp/";
          npm run build -- --base /UmsatzsteuerApp/ 2>&1 | tee build.log || (cat build.log && exit 1)

      - name: Diagnose built index.html
        working-directory: UmsatzsteuerApp_Monorepo_Starter/frontend-belegpruefung
        run: sed -n '1,120p' dist/index.html || true

      - name: Prepare Pages artifact (SPA fallback + nojekyll)
        run: |
          cp UmsatzsteuerApp_Monorepo_Starter/frontend-belegpruefung/dist/index.html UmsatzsteuerApp_Monorepo_Starter/frontend-belegpruefung/dist/404.html || true
          touch UmsatzsteuerApp_Monorepo_Starter/frontend-belegpruefung/dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "UmsatzsteuerApp_Monorepo_Starter/frontend-belegpruefung/dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
