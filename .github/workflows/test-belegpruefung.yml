name: "Test Belegprüfungs Frontend"

on:
  pull_request:
  push:
    branches: [ main ]
    paths:
      - "UmsatzsteuerApp_Monorepo_Starter/frontend-belegpruefung/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install (frontend-belegpruefung)
        working-directory: UmsatzsteuerApp_Monorepo_Starter/frontend-belegpruefung
        run: npm ci || npm i

      - name: Diagnostic environment
        run: |
          node -v || true
          npm -v || true
          pwd
          ls -la
          ls -la UmsatzsteuerApp_Monorepo_Starter/frontend-belegpruefung
          cat UmsatzsteuerApp_Monorepo_Starter/frontend-belegpruefung/package.json
          npx vitest --version || true

      - name: Run unit tests (verbose)
        run: npm -w frontend-belegpruefung run test:unit -- --reporter verbose || npm -w frontend-belegpruefung run test:unit -- --run --reporter verbose

      - name: Build & preview
        run: |
          npm -w frontend-belegpruefung run build
          npm -w frontend-belegpruefung run preview -- --port 5173 &
          sleep 3

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run e2e tests
        run: npm -w frontend-belegpruefung run test:e2e
