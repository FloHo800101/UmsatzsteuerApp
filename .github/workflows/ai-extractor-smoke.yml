name: "AI Extractor Smoke Test"

on:
  push:
    branches: [ main ]
    paths:
      - "UmsatzsteuerApp_Monorepo_Starter/services/ai-extractor/**"
      - ".github/workflows/ai-extractor-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret exists
        run: |
          if [ -z "${{ secrets.RENDER_AI_EXTRACTOR_URL }}" ]; then
            echo "::error::Missing secret RENDER_AI_EXTRACTOR_URL (Render public URL, e.g. https://ai-extractor.onrender.com)"
            exit 1
          fi

      - name: GET /health on Render
        env:
          BASE: ${{ secrets.RENDER_AI_EXTRACTOR_URL }}
        run: |
          echo "Pinging $BASE/health"
          for i in {1..5}; do
            code=$(curl -s -o body.txt -w "%{http_code}" "$BASE/health" || true)
            echo "Attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              grep -q '"ok":true' body.txt && exit 0
            fi
            sleep 3
          done
          echo "::error::Health check failed"
          echo "---- response ----"; cat body.txt || true; echo "-------------------"
          exit 1
